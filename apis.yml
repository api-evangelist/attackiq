aid: attackiq
name: AttackIQ
description: >-
  AttackIQ is a cybersecurity company that pioneered Breach and Attack Simulation
  (BAS) and now delivers a Continuous Threat Exposure Management (CTEM) platform.
  Its Security Optimization Platform continuously and safely emulates real
  adversary tactics, techniques, and procedures aligned to the MITRE ATT&CK
  framework, validating that security controls detect and prevent attacks and
  measuring control effectiveness over time. The platform exposes a REST/JSON
  Platform API (firedrill.attackiq.com/v1) for managing assessments, assets,
  scenarios, tests, and results, authenticated with per-user API tokens, plus an
  official Python SDK and `aiq` command-line interface. AttackIQ is a portfolio
  company of Index Ventures.
